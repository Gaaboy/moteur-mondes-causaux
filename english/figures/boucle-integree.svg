<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1320" height="780" viewBox="0 0 1320 780" role="img" aria-labelledby="title desc">
  <ns0:title id="title">Integrative causal chain and demonstration limits</ns0:title>
  <ns0:desc id="desc">A conceptual chain connects resources, digestion, chemistry, physiology, perception, and action, followed by exchanges with the environment. Status is local and several boundaries remain conditional.</ns0:desc>
  <ns0:defs>
    <ns0:marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <ns0:path d="M1 1 L11 6 L1 11 Z" fill="#287c83" />
    </ns0:marker>
    <ns0:style>
      .bg { fill: #f7f9fb; }
      .title { font: 700 29px Arial, sans-serif; fill: #17324d; }
      .head { font: 700 16px Arial, sans-serif; fill: #17324d; }
      .body { font: 14px Arial, sans-serif; fill: #395268; }
      .status { font: 700 12px Arial, sans-serif; fill: #49645e; }
      .box { fill: #fff; stroke: #b6c8d6; stroke-width: 2; rx: 13; }
      .conditional { fill: #fff7e8; stroke: #d8b46b; stroke-width: 2; rx: 13; }
      .arrow { fill: none; stroke: #287c83; stroke-width: 3; marker-end: url(#arrow); }
      .back { fill: none; stroke: #52709a; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrow); }
      .note { font: 14px Arial, sans-serif; fill: #53687a; }
    </ns0:style>
  </ns0:defs>
  <ns0:rect class="bg" width="1320" height="780" />
  <ns0:text class="title" x="45" y="52">A chain to qualify, not a closed loop</ns0:text>
  <ns0:text class="note" x="45" y="82">Summary diagram; observed results concern the scenarios described in the text.</ns0:text>

  <ns0:rect class="box" x="45" y="150" width="185" height="145" />
  <ns0:text class="head" x="65" y="184">Resources</ns0:text>
  <ns0:text class="body" x="65" y="216">access · withdrawal</ns0:text>
  <ns0:text class="body" x="65" y="241">stocks and transfers</ns0:text>
  <ns0:text class="status" x="65" y="273">LOCAL TESTS</ns0:text>

  <ns0:path class="arrow" d="M230 222 H260" />
  <ns0:rect class="box" x="270" y="150" width="185" height="145" />
  <ns0:text class="head" x="290" y="184">Meal</ns0:text>
  <ns0:text class="body" x="290" y="216">intake · digestion</ns0:text>
  <ns0:text class="body" x="290" y="241">chemical substrates</ns0:text>
  <ns0:text class="status" x="290" y="273">TESTED BRIDGE</ns0:text>

  <ns0:path class="arrow" d="M455 222 H485" />
  <ns0:rect class="box" x="495" y="150" width="185" height="145" />
  <ns0:text class="head" x="515" y="184">Chemistry</ns0:text>
  <ns0:text class="body" x="515" y="216">reactions · gases</ns0:text>
  <ns0:text class="body" x="515" y="241">theoretical ATP</ns0:text>
  <ns0:text class="status" x="515" y="273">LOCAL BALANCES</ns0:text>

  <ns0:path class="arrow" d="M680 222 H710" />
  <ns0:rect class="conditional" x="720" y="150" width="185" height="145" />
  <ns0:text class="head" x="740" y="184">Physiology</ns0:text>
  <ns0:text class="body" x="740" y="216">gases → estimate</ns0:text>
  <ns0:text class="body" x="740" y="241">availability to be established</ns0:text>
  <ns0:text class="status" x="740" y="273">BOUNDED COUPLING</ns0:text>

  <ns0:path class="arrow" d="M905 222 H935" />
  <ns0:rect class="conditional" x="945" y="150" width="185" height="145" />
  <ns0:text class="head" x="965" y="184">Behavior</ns0:text>
  <ns0:text class="body" x="965" y="216">perception · memory</ns0:text>
  <ns0:text class="body" x="965" y="241">decision · action</ns0:text>
  <ns0:text class="status" x="965" y="273">SCENARIO EFFECTS</ns0:text>

  <ns0:path class="arrow" d="M1130 222 H1160" />
  <ns0:rect class="conditional" x="1170" y="150" width="130" height="145" />
  <ns0:text class="head" x="1185" y="184">Environment</ns0:text>
  <ns0:text class="body" x="1185" y="216">movement</ns0:text>
  <ns0:text class="body" x="1185" y="241">heat</ns0:text>
  <ns0:text class="status" x="1185" y="273">CONFIGURED</ns0:text>

  <ns0:path class="back" d="M1234 295 V410 H140 V300" />
  <ns0:text class="note" x="435" y="402">Feedback to the environment depends on explicit transfers and parameters.</ns0:text>

  <ns0:rect x="70" y="475" width="1180" height="88" fill="#e7f3f2" stroke="#287c83" stroke-width="2" rx="14" />
  <ns0:text class="head" x="100" y="510">What interventions can establish</ns0:text>
  <ns0:text class="body" x="100" y="540">Compare a control and an ablation from a shared state; track the selected observable; retain the protocol and failures.</ns0:text>

  <ns0:rect x="70" y="600" width="1180" height="105" fill="#fff7e8" stroke="#d8b46b" stroke-width="2" rx="14" />
  <ns0:text class="head" x="100" y="637">Remaining scientific boundaries</ns0:text>
  <ns0:text class="body" x="100" y="668">Theoretical ATP ≠ available ATP · estimated expenditure ≠ mechanical work · assumed heat ≠ calorimetry</ns0:text>
  <ns0:text class="body" x="100" y="691">A conservative software link is not enough to validate a complete physical budget.</ns0:text>
</ns0:svg>