<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
  <ns0:title id="title">Documentary timeline of the interactive-world project</ns0:title>
  <ns0:desc id="desc">A conceptual timeline presents theoretical foundations, prototypes, multi-domain assemblies, consolidation of the shared foundation, and integration campaigns.</ns0:desc>
  <ns0:defs>
    <ns0:marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <ns0:path d="M1 1 L11 6 L1 11 Z" fill="#287c83" />
    </ns0:marker>
    <ns0:style>
      .bg { fill: #f7f9fb; }
      .title { font: 700 29px Arial, sans-serif; fill: #17324d; }
      .date { font: 700 17px Arial, sans-serif; fill: #17324d; }
      .head { font: 700 16px Arial, sans-serif; fill: #17324d; }
      .body { font: 14px Arial, sans-serif; fill: #395268; }
      .note { font: 13px Arial, sans-serif; fill: #53687a; }
      .archive { fill: #fff7e8; stroke: #d8b46b; stroke-width: 2; rx: 12; }
      .proto { fill: #edf1f8; stroke: #52709a; stroke-width: 2; rx: 12; }
      .canon { fill: #e7f3f2; stroke: #287c83; stroke-width: 3; rx: 12; }
      .line { stroke: #287c83; stroke-width: 4; marker-end: url(#arrow); }
      .dot { fill: #287c83; }
    </ns0:style>
  </ns0:defs>
  <ns0:rect class="bg" width="1280" height="780" />
  <ns0:text class="title" x="48" y="52">Project maturation stages</ns0:text>
  <ns0:text class="note" x="48" y="80">An intellectual and software trajectory; each stage does not mean every earlier mechanism remains active.</ns0:text>
  <ns0:line class="line" x1="100" y1="140" x2="100" y2="685" />

  <ns0:circle class="dot" cx="100" cy="158" r="9" />
  <ns0:rect class="archive" x="145" y="112" width="1060" height="90" />
  <ns0:text class="date" x="175" y="145">Conceptual foundations</ns0:text>
  <ns0:text class="body" x="175" y="172">An ambition to describe causality, organization, and interactions among distinct systems.</ns0:text>
  <ns0:text class="body" x="175" y="192">Older archives provide context but do not establish engine continuity.</ns0:text>

  <ns0:circle class="dot" cx="100" cy="257" r="9" />
  <ns0:rect class="proto" x="145" y="216" width="1060" height="82" />
  <ns0:text class="date" x="175" y="248">Prototypes and mechanisms</ns0:text>
  <ns0:text class="body" x="175" y="276">Ideas take shape in components for the world, body, resources, and observation.</ns0:text>

  <ns0:circle class="dot" cx="100" cy="355" r="9" />
  <ns0:rect class="proto" x="145" y="312" width="1060" height="88" />
  <ns0:text class="date" x="175" y="344">Multi-domain assemblies</ns0:text>
  <ns0:text class="body" x="175" y="372">Attempts to connect several systems reveal challenges in interfaces,</ns0:text>
  <ns0:text class="body" x="175" y="392">timing, units, and continuity between mechanisms.</ns0:text>

  <ns0:circle class="dot" cx="100" cy="458" r="9" />
  <ns0:rect class="proto" x="145" y="414" width="1060" height="90" />
  <ns0:text class="date" x="175" y="446">Consolidation of the shared foundation</ns0:text>
  <ns0:text class="body" x="175" y="474">A selected execution core organizes states, transitions, events, and saves</ns0:text>
  <ns0:text class="body" x="175" y="494">around a shared world, without treating every prototype as a current capability.</ns0:text>

  <ns0:circle class="dot" cx="100" cy="565" r="9" />
  <ns0:rect class="canon" x="145" y="520" width="1060" height="92" />
  <ns0:text class="date" x="175" y="552">Integrative campaigns and calibration</ns0:text>
  <ns0:text class="body" x="175" y="580">Experiments follow longer chains, compare branches, and evaluate selected</ns0:text>
  <ns0:text class="body" x="175" y="600">mechanisms while retaining negative results and open questions.</ns0:text>

  <ns0:circle class="dot" cx="100" cy="673" r="9" />
  <ns0:rect class="canon" x="145" y="628" width="1060" height="95" />
  <ns0:text class="date" x="175" y="660">Interactive-world project · maturation program</ns0:text>
  <ns0:text class="body" x="175" y="688">The goal is to strengthen measurable connections between domains, scales, and forms</ns0:text>
  <ns0:text class="body" x="175" y="709">of organization while distinguishing built capabilities from future possibilities.</ns0:text>
</ns0:svg>