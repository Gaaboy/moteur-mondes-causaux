<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <ns0:title id="title">Operational states–relations–dynamics framework</ns0:title>
  <ns0:desc id="desc">Phi states are connected by lambda relations; chi transitions modify these states and their observable results may feed back.</ns0:desc>
  <ns0:defs>
    <ns0:marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <ns0:path d="M1 1 L11 6 L1 11 Z" fill="#287c83" />
    </ns0:marker>
    <ns0:style>
      .bg { fill: #f7f9fb; }
      .title { font: 700 30px Arial, sans-serif; fill: #17324d; }
      .label { font: 700 25px Arial, sans-serif; fill: #17324d; }
      .small { font: 16px Arial, sans-serif; fill: #395268; }
      .note { font: 14px Arial, sans-serif; fill: #53687a; }
      .state { fill: #eaf0f8; stroke: #52709a; stroke-width: 3; rx: 20; }
      .relation { fill: #e7f3f2; stroke: #287c83; stroke-width: 3; rx: 20; }
      .dynamics { fill: #fff1df; stroke: #c17b2d; stroke-width: 3; rx: 20; }
      .arrow { fill: none; stroke: #287c83; stroke-width: 4; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #78909f; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
    </ns0:style>
  </ns0:defs>
  <ns0:rect class="bg" width="1280" height="650" />
  <ns0:text class="title" x="48" y="58">φ–λ–χ: an engineering grammar for transitions</ns0:text>

  <ns0:rect class="state" x="65" y="170" width="310" height="220" />
  <ns0:text class="label" x="100" y="220">φ · Carried states</ns0:text>
  <ns0:text class="small" x="100" y="263">stocks · positions · capacities</ns0:text>
  <ns0:text class="small" x="100" y="293">physiological states · memory</ns0:text>
  <ns0:text class="small" x="100" y="323">variables with units and an owner</ns0:text>
  <ns0:text class="small" x="100" y="357">what the world carries at a given moment</ns0:text>

  <ns0:path class="arrow" d="M375 280 H490" />
  <ns0:rect class="relation" x="505" y="170" width="310" height="220" />
  <ns0:text class="label" x="540" y="220">λ · Relations</ns0:text>
  <ns0:text class="small" x="540" y="263">access · transfer · constraint</ns0:text>
  <ns0:text class="small" x="540" y="293">producer and consumer</ns0:text>
  <ns0:text class="small" x="540" y="323">declared conditions and provenance</ns0:text>
  <ns0:text class="small" x="540" y="357">what permits influence</ns0:text>

  <ns0:path class="arrow" d="M815 280 H930" />
  <ns0:rect class="dynamics" x="945" y="170" width="270" height="220" />
  <ns0:text class="label" x="980" y="220">χ · Dynamics</ns0:text>
  <ns0:text class="small" x="980" y="263">laws · rules · transitions</ns0:text>
  <ns0:text class="small" x="980" y="293">explicit parameters and cadence</ns0:text>
  <ns0:text class="small" x="980" y="323">observable results and events</ns0:text>
  <ns0:text class="small" x="980" y="357">what transforms states</ns0:text>

  <ns0:path class="loop" d="M1080 390 C1080 520 230 520 220 395" />
  <ns0:text class="note" x="430" y="495">Transitions produce new states; feedback must be identified and tested.</ns0:text>

  <ns0:rect x="110" y="555" width="1060" height="54" fill="#fff7e8" stroke="#d8b46b" stroke-width="2" rx="12" />
  <ns0:text class="note" x="140" y="588">The framework organizes code and protocols; it replaces neither domain-specific equations nor their calibration.</ns0:text>
</ns0:svg>