<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <ns0:title id="title">Map of the multi-domain causal engine</ns0:title>
  <ns0:desc id="desc">The states–relations–dynamics framework feeds a shared causal world; specialized domains modify it, while the journal, checkpoints, replays, and interventions make trajectories comparable. Product tools provide access without replacing canonical state.</ns0:desc>
  <ns0:defs>
    <ns0:marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><ns0:path d="M0 0L10 5L0 10z" fill="#527d83" /></ns0:marker>
    <ns0:marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><ns0:path d="M0 0L10 5L0 10z" fill="#b98248" /></ns0:marker>
    <ns0:style>
      .bg{fill:#f3f6f4}.title{font:700 29px Arial,sans-serif;fill:#17384a}.sub{font:16px Arial,sans-serif;fill:#536a70}
      .head{font:700 18px Arial,sans-serif;fill:#17384a}.body{font:15px Arial,sans-serif;fill:#40565d}.small{font:13px Arial,sans-serif;fill:#61757a}
      .card{fill:#fff;stroke:#cbd9d8;stroke-width:1.5}.blue{fill:#e4eff0;stroke:#93b5b7}.sand{fill:#f7eddd;stroke:#d9bc8f}.green{fill:#e8efe5;stroke:#afc2a9}.dark{fill:#173e52;stroke:#173e52}.white{fill:#f7f7ef}
      .line{stroke:#527d83;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.goldline{stroke:#b98248;stroke-width:2.3;fill:none;marker-end:url(#arrowGold)}
      .dash{stroke:#98aaab;stroke-width:1.5;stroke-dasharray:7 6;fill:none}
    </ns0:style>
  </ns0:defs>
  <ns0:rect class="bg" width="1200" height="850" rx="22" />
  <ns0:text class="title" x="52" y="58">One causal engine, multiple domains, comparable trajectories</ns0:text>
  <ns0:text class="sub" x="52" y="88">Theoretical framework → executable world → observations → interventions and replay</ns0:text>

  <ns0:rect class="card sand" x="52" y="120" width="1096" height="142" rx="18" />
  <ns0:text class="head" x="78" y="151">Description and research framework</ns0:text>
  <ns0:rect class="card" x="78" y="172" width="280" height="62" rx="12" />
  <ns0:text class="head" x="98" y="198">φ · Carried states</ns0:text><ns0:text class="small" x="98" y="220">stocks, positions, memory, capacities</ns0:text>
  <ns0:rect class="card" x="460" y="172" width="280" height="62" rx="12" />
  <ns0:text class="head" x="480" y="198">λ · Relations</ns0:text><ns0:text class="small" x="480" y="220">access, constraints, transfers, links</ns0:text>
  <ns0:rect class="card" x="842" y="172" width="280" height="62" rx="12" />
  <ns0:text class="head" x="862" y="198">χ · Dynamics</ns0:text><ns0:text class="small" x="862" y="220">transitions, rhythms, rules of change</ns0:text>
  <ns0:path class="line" d="M358 203H450" /><ns0:path class="line" d="M740 203H832" />
  <ns0:path class="goldline" d="M982 242C920 276 272 276 218 242" />
  <ns0:text class="small" x="488" y="254">events, time, memory, and feedback make the present depend on history</ns0:text>

  <ns0:path class="line" d="M600 263V304" />
  <ns0:rect class="card dark" x="220" y="310" width="760" height="105" rx="18" />
  <ns0:text class="head white" x="600" y="348" text-anchor="middle">Shared causal world</ns0:text>
  <ns0:text class="body white" x="600" y="377" text-anchor="middle">canonical state · ordered-phase scheduler · current global cadence</ns0:text>
  <ns0:text class="small white" x="600" y="400" text-anchor="middle">domains remain distinct; not all are active in every scenario</ns0:text>

  <ns0:path class="line" d="M600 415V446" />
  <ns0:rect class="card green" x="52" y="452" width="1096" height="174" rx="18" />
  <ns0:text class="head" x="78" y="484">Specialized domains connected according to scenario conditions</ns0:text>
  <ns0:rect class="card" x="78" y="504" width="195" height="86" rx="12" />
  <ns0:text class="head" x="175" y="535" text-anchor="middle">Physics &amp; space</ns0:text><ns0:text class="small" x="175" y="560" text-anchor="middle">movement, contact, light</ns0:text>
  <ns0:rect class="card" x="294" y="504" width="195" height="86" rx="12" />
  <ns0:text class="head" x="391" y="535" text-anchor="middle">Matter &amp; water</ns0:text><ns0:text class="small" x="391" y="560" text-anchor="middle">stocks, access, transfers</ns0:text>
  <ns0:rect class="card" x="510" y="504" width="195" height="86" rx="12" />
  <ns0:text class="head" x="607" y="535" text-anchor="middle">Chemistry &amp; body</ns0:text><ns0:text class="small" x="607" y="560" text-anchor="middle">reactions, needs, vitality</ns0:text>
  <ns0:rect class="card" x="726" y="504" width="195" height="86" rx="12" />
  <ns0:text class="head" x="823" y="535" text-anchor="middle">Perception &amp; memory</ns0:text><ns0:text class="small" x="823" y="560" text-anchor="middle">attention, choice, learning</ns0:text>
  <ns0:rect class="card" x="942" y="504" width="180" height="86" rx="12" />
  <ns0:text class="head" x="1032" y="535" text-anchor="middle">Ecology &amp; groups</ns0:text><ns0:text class="small" x="1032" y="560" text-anchor="middle">resources, roles, maintenance</ns0:text>

  <ns0:path class="line" d="M600 626V653" />
  <ns0:rect class="card blue" x="52" y="659" width="1096" height="112" rx="18" />
  <ns0:text class="head" x="78" y="691">Causal instrumentation</ns0:text>
  <ns0:text class="body" x="80" y="722">event ID &amp; declared causes</ns0:text>
  <ns0:text class="body" x="357" y="722">versioned checkpoints &amp; resumption</ns0:text>
  <ns0:text class="body" x="672" y="722">control, ablation &amp; comparison</ns0:text>
  <ns0:text class="body" x="945" y="722">observables &amp; post-mortem</ns0:text>
  <ns0:text class="small" x="78" y="751">Journal consistency and replay are checked for tested fields; they do not prove universal model validity.</ns0:text>

  <ns0:path class="goldline" d="M600 771V798" />
  <ns0:text class="head" x="600" y="827" text-anchor="middle">Product surfaces: create · inhabit · observe · modify — durable integration in progress</ns0:text>
</ns0:svg>