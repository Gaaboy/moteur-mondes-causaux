<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <ns0:title id="title">Conceptual view of the Causal Worlds Engine architecture</ns0:title>
  <ns0:desc id="desc">A scenario feeds a shared canonical world whose systems produce observable transitions and events. Experiments intervene in the world and compare replayable branches.</ns0:desc>
  <ns0:defs>
    <ns0:marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <ns0:path d="M1 1 L11 6 L1 11 Z" fill="#287c83" />
    </ns0:marker>
    <ns0:style>
      .bg { fill: #f7f9fb; }
      .title { font: 700 30px Arial, sans-serif; fill: #17324d; }
      .sub { font: 16px Arial, sans-serif; fill: #516476; }
      .label { font: 700 18px Arial, sans-serif; fill: #17324d; }
      .small { font: 15px Arial, sans-serif; fill: #395268; }
      .note { font: 14px Arial, sans-serif; fill: #53687a; }
      .box { fill: #fff; stroke: #b6c8d6; stroke-width: 2; rx: 14; }
      .core { fill: #e7f3f2; stroke: #287c83; stroke-width: 3; rx: 18; }
      .evidence { fill: #edf1f8; stroke: #52709a; stroke-width: 2; rx: 14; }
      .arrow { fill: none; stroke: #287c83; stroke-width: 3; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 7; }
    </ns0:style>
  </ns0:defs>
  <ns0:rect class="bg" width="1280" height="720" />
  <ns0:text class="title" x="48" y="58">Causal Worlds Engine — shared causal world</ns0:text>
  <ns0:text class="sub" x="48" y="88">Conceptual diagram: not every module or connection shown is active in every scenario.</ns0:text>

  <ns0:rect class="box" x="50" y="145" width="230" height="128" />
  <ns0:text class="label" x="75" y="183">Scenario</ns0:text>
  <ns0:text class="small" x="75" y="213">initial states · profiles</ns0:text>
  <ns0:text class="small" x="75" y="239">scenario conditions</ns0:text>

  <ns0:path class="arrow" d="M280 209 H350" />
  <ns0:rect class="core" x="365" y="125" width="535" height="168" />
  <ns0:text class="label" x="395" y="166">Shared world · canonical state</ns0:text>
  <ns0:text class="small" x="395" y="199">Identities · φ states · λ relations · χ transitions</ns0:text>
  <ns0:text class="small" x="395" y="227">Global scheduler · declared units and contracts</ns0:text>
  <ns0:text class="small" x="395" y="255">Activation depends on scenario and configuration</ns0:text>

  <ns0:path class="arrow" d="M900 209 H972" />
  <ns0:rect class="box" x="990" y="145" width="240" height="128" />
  <ns0:text class="label" x="1015" y="183">Observables</ns0:text>
  <ns0:text class="small" x="1015" y="213">states · measures · events</ns0:text>
  <ns0:text class="small" x="1015" y="239">declared provenance</ns0:text>

  <ns0:path class="arrow" d="M632 293 V356" />
  <ns0:rect class="box" x="95" y="375" width="330" height="150" />
  <ns0:text class="label" x="120" y="414">Producing systems</ns0:text>
  <ns0:text class="small" x="120" y="447">matter · environment · chemistry</ns0:text>
  <ns0:text class="small" x="120" y="475">body · perception · decision · society</ns0:text>
  <ns0:text class="small" x="120" y="503">produce states and events</ns0:text>

  <ns0:rect class="box" x="475" y="375" width="330" height="150" />
  <ns0:text class="label" x="500" y="414">Testable relations</ns0:text>
  <ns0:text class="small" x="500" y="447">transfers · constraints · access</ns0:text>
  <ns0:text class="small" x="500" y="475">units · sources · consumers</ns0:text>
  <ns0:text class="small" x="500" y="503">guardrails and selected observables</ns0:text>

  <ns0:rect class="evidence" x="855" y="375" width="330" height="150" />
  <ns0:text class="label" x="880" y="414">Experiments</ns0:text>
  <ns0:text class="small" x="880" y="447">save · control · intervention</ns0:text>
  <ns0:text class="small" x="880" y="475">replay · ablation · comparison</ns0:text>
  <ns0:text class="small" x="880" y="503">results bounded by protocol</ns0:text>

  <ns0:path class="arrow dashed" d="M260 375 V325 H470 V293" />
  <ns0:path class="arrow" d="M425 450 H475" />
  <ns0:path class="arrow" d="M805 450 H855" />
  <ns0:path class="arrow dashed" d="M1020 375 V325 H795 V293" />

  <ns0:rect x="95" y="575" width="1090" height="78" fill="#fff7e8" stroke="#d8b46b" stroke-width="2" rx="12" />
  <ns0:text class="small" x="120" y="608">Reading: shared state facilitates connections; their presence guarantees neither activation nor real-world scope.</ns0:text>
  <ns0:text class="note" x="120" y="634">Arrows show possible paths, not an exhaustive execution graph or an experimental result.</ns0:text>
</ns0:svg>